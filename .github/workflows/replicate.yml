name: Verify Replication

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  replicate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install replication dependencies
        run: pip install -r requirements.txt

      - name: Reproduce and verify all tables and figures
        run: python3 run_all.py

      - name: Upload reproduced outputs
        uses: actions/upload-artifact@v4
        with:
          name: replication-outputs
          path: output/
          retention-days: 14
